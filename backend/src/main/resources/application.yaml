spring:
  application:
    name: ${MTS_APP_NAME:online-shop}
  jersey:
    application-path: /engine-rest
  mvc:
    throw-exception-if-no-handler-found: true
    formcontent:
      filter:
        # Camunda login uses Jersey @FormParam on the raw body; FormContentFilter consumes it and breaks the session.
        enabled: false
  web:
    resources:
      add-mappings: false
  liquibase:
    enabled: ${MTS_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yml
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${MTS_DB_HOST:localhost}:${MTS_DB_PORT:5432}/${MTS_DB_NAME:db_backend}
    username: ${MTS_DB_USERNAME:postgres}
    password: ${MTS_DB_PASSWORD:postgres}

  mail:
    host: ${MTS_MAIL_HOST:smtp.mail.ru}
    port: ${MTS_MAIL_PORT:465}
    username: ${MTS_MAIL_USERNAME:noreply@localhost}
    password: ${MTS_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

server:
  port: ${MTS_PORT:8080}
  servlet:
    context-path: ${MTS_CONTEXT_PATH:}
    session:
      cookie:
        path: /
        same-site: lax

jwt:
  secret: ${MTS_JWT_SECRET:s9/PnuqMovO16uMBoWSjwoWI8etyn1KLFvfCLyTXq+g=}
  expiration-ms: ${MTS_JWT_EXPIRATION_MS:1800000}

bank:
  base-url: ${BANK_URL:http://localhost:8081}

app:
  mqtt:
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:online-shop}
    topic: ${MQTT_TELEGRAM_TOPIC:mts/shop/telegram/notify}
  bitrix:
    enabled: ${BITRIX_EIS_ENABLED:false}
    webhook-base: ${BITRIX_WEBHOOK_BASE:}
  bank:
    health-check-ms: ${BANK_HEALTH_CHECK_MS:300000}

logging:
  level:
    root: ${MTS_LOG_LEVEL:INFO}
    liquibase: INFO
    org.springframework.boot.autoconfigure.liquibase: INFO

# Paths are relative to server root; context-path (e.g. /api) is applied by Spring — do not prefix with /api again.
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    enabled: true
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs

mail:
  from: ${MTS_MAIL_USERNAME:noreply@localhost}

camunda:
  bpm:
    webapp:
      # иначе /camunda/ открывает Welcome (требует отдельных прав), а не Tasklist
      index-redirect-enabled: false
    admin-user:
      id: ${CAMUNDA_ADMIN_USER:demo}
      password: ${CAMUNDA_ADMIN_PASSWORD:demo}
      firstName: Demo
      lastName: Admin
    filter:
      create: All tasks
    database:
      schema-update: true
    auto-deployment-enabled: true
    deploy-changed-only: true
    deployment-name: mts-online-shop
    deployment-resource-pattern:
      - classpath*:processes/**/*.bpmn
      - classpath*:processes/**/*.form
    authorization:
      enabled: true
    generic-properties:
      properties:
        loginMaxAttempts: 2147483647
        loginDelayBase: 0
        loginDelayMaxTime: 0
        loginDelayFactor: 1
    job-execution:
      enabled: true
    history-level: ${CAMUNDA_HISTORY_LEVEL:full}